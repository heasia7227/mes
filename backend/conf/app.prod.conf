# 开启 panic 恢复
recoverpanic = true

appname = api-service
httpport = 8080
runmode = dev
api_prefix = /api
copyrequestbody = true
EnableDocs = false

# Database configuration
db_driver = mysql
db_host = 192.168.110.70
db_port = 3306
db_user = root
db_pass = root
db_name = mes
db_charset = utf8mb4
db_max_idle = 50
db_max_conn = 100

# Redis配置
redis_addr = 192.168.110.70:6379
redis_password = charmray@2024
redis_db = 1
redis_pool_size = 10

# jwt配置
jwt.secret = "mes-secret-key-2026-token"
jwt.access_expire = 24   # token过期时间, 单位小时, 默认 24小时

# upload file path
upload_file_path = /data/mes/backend/upload

# 日志配置
logs.path = /data/mes/backend/logs

# 登录限制
single_login = false

